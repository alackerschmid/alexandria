name = "bookscan"
pages_build_output_dir = "dist"

# Build-time env var for the Vite build (frontend → worker API base). This file is the single
# source for it: the Deploy workflow greps the value out of here and exports it before
# `npm run build-only`, and Vite picks up VITE_-prefixed process env vars. Keep the assignment on
# one line with a double-quoted value — that is the shape the workflow's sed expects, and it fails
# the deploy rather than shipping a frontend with no API base.
[vars]
VITE_API_URL = "https://bookscan-worker.a-lackerschmid.workers.dev"
