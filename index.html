<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icons/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Alexandria</title>

    <meta
      name="description"
      content="Rebuild the library of Alexandria, one book at a time."
    />
    <meta name="theme-color" content="#ff6600" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Alexandria" />

    <meta property="og:title" content="Alexandria" />
    <meta
      property="og:description"
      content="Rebuild the library of Alexandria, one book at a time."
    />
    <meta property="og:type" content="website" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <script>
      if (localStorage.getItem("theme") === "dark")
        document.documentElement.dataset.theme = "dark";
    </script>
  </head>
  <body>
    <noscript>Alexandria requires JavaScript.</noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
